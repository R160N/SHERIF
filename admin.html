<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>SHERIFF OIL | Admin Dashboard</title>
  <meta http-equiv="refresh" content="0; url=admin/">
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      color: #141416;
      background: #fff;
    }

    main {
      width: min(420px, calc(100% - 32px));
      text-align: center;
    }

    img {
      width: 220px;
      max-width: 100%;
      height: auto;
      margin: 0 auto 20px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.4rem;
    }

    p {
      margin: 0 0 18px;
      color: #62666f;
    }

    a {
      display: inline-flex;
      min-height: 44px;
      align-items: center;
      justify-content: center;
      padding: 0 18px;
      border-radius: 999px;
      color: #fff;
      background: #d71920;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
  <script>window.location.replace("admin/");</script>
</head>
<body>
  <main>
    <img src="assets/sherif-logo.png" alt="SHERIFF OIL logo">
    <h1>SHERIFF OIL Admin</h1>
    <p>Opening the secure dashboard.</p>
    <a href="admin/">Open dashboard</a>
  </main>
</body>
</html>
