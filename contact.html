<body data-page="contact">
  <div class="site-loader" role="status" aria-live="polite"><img data-logo src="assets/sherif-logo.png" alt="SHERIFF OIL logo"><span data-i18n="common.loading">Duke hapur SHERIFF OIL</span></div>
  <header class="site-header"><div class="container header-inner"><a class="brand page-link" href="index.html" aria-label="SHERIFF OIL"><img data-logo src="assets/sherif-logo.png" alt="SHERIFF OIL logo"></a><button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-navigation" aria-label="Open navigation"><span></span><span></span><span></span></button><div class="nav-panel" id="site-navigation"><nav class="nav-links" data-nav-links aria-label="Primary navigation"></nav><div class="language-switcher" aria-label="Language"><button class="language-button" type="button" data-language="sq">SQ</button><button class="language-button" type="button" data-language="en">EN</button><button class="language-button" type="button" data-language="sr">SR</button></div></div></div></header>

  <main>
    <section class="page-hero page-hero-centered">
      <div class="container narrow reveal">
        <p class="eyebrow" data-i18n="contact.eyebrow"></p>
        <h1 data-i18n="contact.title">Flisni me ekipin e SHERIFF OIL.</h1>
        <p data-i18n="contact.text"></p>
      </div>
    </section>

    <section class="section section-soft">
      <div class="container contact-layout">
        <div class="details-panel reveal">
          <span class="badge" data-i18n="common.open247"></span>
          <h2 data-i18n="contact.detailsTitle">Detajet e kontaktit</h2>
          <div class="contact-list">
            <div><span data-icon="phone"></span><div><small data-i18n="common.phone"></small><a data-contact="phone" href="tel:044517400"></a></div></div>
            <div><span data-icon="mail"></span><div><small data-i18n="common.email"></small><a data-contact="email" href="mailto:rigondragusha6@gmail.com"></a></div></div>
            <div><span data-icon="pin"></span><div><small data-i18n="common.address"></small><strong data-contact="address"></strong></div></div>
            <div><span data-icon="clock"></span><div><small data-i18n="common.hours"></small><strong data-contact="hours"></strong></div></div>
          </div>
        </div>

        <form class="contact-form reveal" data-contact-form novalidate>
          <label class="field">
            <span data-i18n="form.fullName"></span>
            <input name="fullName" type="text" autocomplete="name" required data-i18n-placeholder="form.fullNamePlaceholder">
          </label>
          <label class="field">
            <span data-i18n="form.phone"></span>
            <input name="phone" type="tel" autocomplete="tel" data-i18n-placeholder="form.phonePlaceholder">
          </label>
          <label class="field">
            <span data-i18n="form.email"></span>
            <input name="email" type="email" autocomplete="email" required data-i18n-placeholder="form.emailPlaceholder">
          </label>
          <label class="field">
            <span data-i18n="form.message"></span>
            <textarea name="message" rows="6" required data-i18n-placeholder="form.messagePlaceholder"></textarea>
          </label>
          <button class="btn btn-primary" type="submit" data-i18n="buttons.sendMessage"></button>
          <p class="form-status" data-form-status role="status" aria-live="polite"></p>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-grid">
      <div><img class="footer-logo" data-logo src="assets/sherif-logo.png" alt="SHERIFF OIL logo"><p data-i18n="footer.text"></p></div>
        <div><h2 data-i18n="footer.links">Faqet</h2><nav class="footer-links" data-footer-pages></nav></div>
        <div><h2 data-i18n="footer.services">Shërbimet</h2><nav class="footer-links" data-footer-services></nav></div>
        <div><h2 data-i18n="footer.contact">Kontakti</h2><div class="footer-links"><span data-contact="address"></span><a data-contact="phone" href="tel:044517400"></a><a data-contact="email" href="mailto:rigondragusha6@gmail.com"></a><span data-contact="hours"></span></div></div>
    </div>
    <div class="container footer-bottom"><p>© <span data-current-year></span> SHERIFF OIL. <span data-i18n="footer.rights"></span></p></div>
  </footer>
</body>
